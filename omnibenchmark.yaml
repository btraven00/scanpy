# OmniBenchmark Module Configuration

entrypoints:
  pca: pca.py
  pca-prof: prof.sh pca.py
  knn: knn.py
  knn-prof: prof.sh knn.py
  cluster: cluster.py
  cluster-prof: prof.sh cluster.py
  normalize: normalize.py
  feat-select: feat-select.py
  ndimr: ndimr.py
  rdimr: rdimr.py

# common code
# `pixi run -e dev sync` (from this module root) refreshes it.
templates:
  repo: https://github.com/omni-scrna/boilerplate
  ref: main
  lang: python

# benchmark(s) this module works with
benchmarks:
  - name: split-stages
    repo: https://github.com/btraven00/omni-scrna-plan  # embed-gen: NDIMR + RDIMR schemas, not upstream yet
    plan: benchmark_conda.yaml
    ref: embed-gen
